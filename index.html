<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KETON-GARRET · 像素阁楼</title>
    <!-- 完全复古像素风格，致敬老式Myspace / 90年代个人网页 -->
    <style>
        /* 像素艺术重置 —— 什么都别留下，除了像素 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }

        /* ===== 你提供的老背景代码 —— 完整保留并放在最前面 ===== */
        .backgrounds { /* Code Generated by Backgrounds Archive */ }
        table, tr, td { background-color: transparent; border: none; border-width: 0; }
        body {
            background-image: url('http://dl.backgroundsarchive.net/pub/2/2487rr5yvs34mb.jpg');
            background-attachment: scrolling;
            background-repeat: repeat;
            /* 保证背景铺满整个页面，没有任何白色干扰 */
            background-color: #c1a5c9; /* 老式紫灰 fallback */
            font-family: 'VT323', 'Courier New', 'MS Gothic', 'Fixedsys', monospace;
            color: #ffffaa;
            cursor: url('data:image/x-icon;base64,AAACAAEAICACAAAAAAAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'), auto; /* 像素指针可选 */
        }

        /* 保持背景不被内容遮挡透明度问题——内容区域用半透明黑底让背景透出来 */
        .container {
            max-width: 780px;
            margin: 30px auto 30px 30px;  /* 经典左上角偏移，就像老式浏览器 */
            background-color: rgba(10, 5, 20, 0.75);  /* 半透明深紫色，能透出背景 */
            border: 4px solid #c2a1d0;
            border-right-color: #503778;
            border-bottom-color: #503778;
            padding: 25px 25px 35px 30px;
            box-shadow: 8px 8px 0 #2a1a3a;
            image-rendering: pixelated;
        }

        /* 像素标题——巨大且带边框 */
        .pixel-title {
            font-family: 'VT323', 'Press Start 2P', 'Courier New', monospace;
            font-size: 4.2rem;
            letter-spacing: 4px;
            line-height: 1.1;
            color: #ffccff;
            text-shadow: 3px 3px 0 #b472d0, 5px 5px 0 #3f2355;
            margin-bottom: 10px;
            word-break: break-word;
            text-transform: uppercase;
            border-bottom: 4px dotted #f9b5ff;
            padding-bottom: 10px;
        }

        .pixel-sub {
            font-size: 2rem;
            color: #b0e0ff;
            margin-top: -5px;
            margin-bottom: 20px;
            font-family: 'Courier New', monospace;
            background: #210f2e;
            display: inline-block;
            padding: 6px 20px 6px 15px;
            border: 2px solid #bb92d9;
            box-shadow: inset -2px -2px 0 #270e38;
            letter-spacing: 2px;
        }

        /* 像素分割线 */
        .pixel-divider {
            height: 8px;
            background: repeating-linear-gradient(90deg, #cb9eff 0px, #cb9eff 8px, #4f2d75 8px, #4f2d75 16px);
            margin: 30px 0 28px 0;
            border: 2px solid #3f2555;
        }

        /* 关于卡片——看起来像老电脑对话框 */
        .about-box {
            background-color: #191124;
            border: 4px solid #9b7bb5;
            border-right-color: #422b57;
            border-bottom-color: #422b57;
            padding: 22px 20px 25px 25px;
            margin: 25px 0 20px 0;
            color: #f0e6b2;
            box-shadow: inset -2px -2px 0 #2f1d40, 6px 6px 0 #0f0820;
        }

        .greeting {
            font-size: 2.8rem;
            font-weight: bold;
            color: #fcd48c;
            margin-bottom: 10px;
            font-family: 'VT323', monospace;
            background: #2d1d35;
            display: inline-block;
            padding: 6px 25px 2px 15px;
            border: 2px solid #e2a2ff;
            transform: rotate(-0.5deg);
            letter-spacing: 2px;
        }

        .greeting span {
            font-size: 1.8rem;
            color: #fbb8ff;
        }

        .about-text {
            font-size: 2rem;
            font-family: 'Courier New', 'MS Gothic', monospace;
            line-height: 1.6;
            margin: 20px 0 20px 15px;
            color: #ffffaa;
            text-shadow: 1px 1px 0 #3f1d5e;
            border-left: 4px solid #c58aff;
            padding-left: 20px;
        }

        .signature {
            font-size: 2.2rem;
            font-family: 'Comic Sans MS', 'Courier New', cursive;  /* 故意混搭像素不协调 */
            color: #acd2ff;
            text-align: right;
            margin-top: 25px;
            border-top: 3px dashed #af84cf;
            padding-top: 15px;
            padding-right: 15px;
            letter-spacing: 1px;
        }

        .signature i {
            font-size: 2rem;
            filter: drop-shadow(2px 2px 0 #1c0527);
        }

        /* 像素联系人区块 —— 像地址簿标签 */
        .contact-panel {
            background: #21162b;
            border: 6px double #bc98e6;
            padding: 18px 20px 18px 20px;
            margin: 30px 0 10px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
            border-right: 6px solid #673f8b;
            border-bottom: 6px solid #3e2860;
        }

        .contact-label {
            font-family: 'VT323', monospace;
            font-size: 2.4rem;
            color: #fee17c;
            background: #371f47;
            padding: 5px 20px 5px 20px;
            border: 3px ridge #d9aaff;
            text-transform: uppercase;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .contact-label i {
            font-size: 2.6rem;
            color: #e9b3ff;
            filter: drop-shadow(3px 3px 0 #391f45);
        }

        .pixel-email {
            font-family: 'Courier New', monospace;
            font-size: 2.2rem;
            background: #10081a;
            color: #aaffaa;
            padding: 10px 30px 10px 25px;
            border: 3px solid #dbbaff;
            border-right-color: #452f63;
            border-bottom-color: #452f63;
            text-decoration: none;
            word-break: break-all;
            box-shadow: 5px 5px 0 #1e112b;
            transition: 0.1s linear;
            letter-spacing: 1.5px;
        }

        .pixel-email:hover {
            background: #1f112f;
            color: #ffffaa;
            border-color: #fdd7ff;
            box-shadow: 3px 3px 0 #633e81;
            transform: translate(2px, 2px);
        }

        /* 老式计数器 / 脚注区域 */
        .footer-pixel {
            margin-top: 35px;
            text-align: center;
            font-size: 1.5rem;
            background: #221530;
            border-top: 4px solid #a27bb9;
            padding: 15px 0;
            color: #beb1d5;
            font-family: 'MS Gothic', 'Courier New', monospace;
            border-bottom: 2px solid #9771b5;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .footer-pixel i {
            color: #ffc8a7;
            margin: 0 6px;
            font-size: 1.6rem;
        }

        .footer-pixel a {
            color: #c1ffb0;
            text-decoration: none;
            background: #302239;
            padding: 2px 10px;
            border: 2px solid #a682cb;
        }

        .footer-pixel a:hover {
            background: #542b7a;
            color: #ffffaa;
        }

        /* 你提供的背景小广告区域 —— 原样重现并融入设计 */
        #Backgrounds {
            left: 10px;
            top: 8px;
            position: absolute;
            z-index: 999; /* 保证小标志浮在上层，复古感 */
            background: transparent;
            mix-blend-mode: normal;
        }

        /* 下面那行链接也保留但挪到容器外，我们直接重复你给的链接放在页脚上方做彩蛋 */
        .old-school-link {
            font-size: 1.4rem;
            text-align: left;
            margin: 10px 0 0 20px;
            color: #f7d6ff;
        }
        .old-school-link a {
            color: #b2ffa8;
            background: #28003d;
            padding: 2px 8px;
            border: 2px outset #9f83c9;
            text-decoration: none;
        }
        .old-school-link a:hover {
            background: #491b75;
        }

        /* 鼠标样式像素化 */
        body * {
            cursor: url('data:image/x-icon;base64,AAACAAEAICACAAAAAAAwAQAAFgAAACgAAAAgAAAAQAAAAAEAAQAAAAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA////AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA'), auto;
        }

        @media (max-width: 600px) {
            .container { margin: 15px; padding: 15px; }
            .pixel-title { font-size: 2.8rem; }
            .about-text { font-size: 1.5rem; }
            .greeting { font-size: 2rem; }
        }
    </style>
    <!-- 保留你提供的背景archive标记和链接 (完全原封不动) -->
    <div id="Backgrounds" style="left:10; top: 8; position: absolute;">
        <a href="http://backgroundsarchive.com">
            <img src="http://dl.backgroundsarchive.net/banners/cute.gif" alt="myspace backgrounds" border="0">
        </a>
    </div>
    <!-- 这是那行小链接，我们让它显示在左上附近，但为了防止盖住文字，可以用绝对定位微调 -->
    <div style="position: absolute; top: 55px; left: 15px; z-index: 999; background: rgba(0,0,0,0.6); padding: 3px 8px; border: 2px solid #a57bc5;">
        <a href="http://backgroundsarchive.com" style="color: #c6ffb0; font-family: monospace; font-size: 14px;">Myspace Backgrounds</a>
    </div>
    <!-- 像素字体备用导入 (VT323 很适合像素风格) -->
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    <!-- 少量图标增加怀旧感，但不影响像素主体 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <!-- 整个内容容器——半透明，背景透出你指定的archive背景 -->
    <div class="container">
        <!-- 大标题：KETON-GARRET 像素风格 -->
        <div class="pixel-title">
            KETON-GARRET
        </div>
        <div class="pixel-sub">
            ⚡ 博客阁楼 · 像素重构 ⚡
        </div>

        <!-- 像素分割线 -->
        <div class="pixel-divider"></div>

        <!-- 自我介绍区域：完全保留你的文字，但以像素形式呈现 -->
        <div class="about-box">
            <div class="greeting">
                📟 欢迎光临 <span>(^_^)</span>
            </div>
            <div class="about-text">
                博客阁楼！我是keton，<br>一个绘画音乐爱好者，代码新人初尝试。<br>感谢访问。
            </div>
            <div class="signature">
                <i class="fa-regular fa-compass"></i> Dancing in the moonlight
                <span style="font-size:2rem;">⚘</span>
            </div>
        </div>

        <!-- 联系我 —— 像素大邮箱 -->
        <div class="contact-panel">
            <span class="contact-label">
                <i class="fa-regular fa-envelope"></i> 联络
            </span>
            <a href="mailto:3032382526@qq.com" class="pixel-email">
                3032382526@qq.com
            </a>
        </div>

        <!-- 额外怀旧: 访问计数器(模拟) -->
        <div style="font-family:'VT323'; font-size:1.8rem; color:#dbbdff; margin-top:20px; display:flex; gap:30px;">
            <span>📊 访客: 000248</span>
            <span>🕹️ 建造中 since 2025</span>
        </div>

        <!-- 像素脚注 -->
        <div class="footer-pixel">
            <i class="fa-regular fa-pen-to-square"></i> keton 的小阁楼 · 手工像素 · 丙午年 
            <i class="fa-regular fa-floppy-disk"></i>
        </div>

        <!-- 完全保留你提供的链接，放在容器内底部作为老式致敬 -->
        <div class="old-school-link">
            🔗 <a href="http://backgroundsarchive.com" target="_blank">Myspace Backgrounds</a> 来自背景archive 怀旧永存
        </div>
    </div>

    <!-- 再次确保你提供的背景标记没有被覆盖，已在顶部插入，但为了防止位置跑偏，再补一个透明的占位 -->
    <div style="height:0; overflow:visible;">
        <!-- 背景banner已放最前，此处无需再重复 -->
    </div>

    <!-- 没有现代框架，纯正90年代像素 -->
</body>
</html>
